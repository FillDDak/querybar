<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>querybar playground</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #dcdcd8;
    --accent: #2f5bd3; --field: #7a3fbf; --value: #0b7a55; --op: #c2410c; --kw: #b4237a;
    --neg: #b42318; --err-bg: #fde7e7; --warn: #a15c00; --chip: #eef1fb; --chip-on: #2f5bd3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --text: #ececf0; --muted: #9a9aa3; --border: #34343a;
      --accent: #8aa8ff; --field: #c39bff; --value: #5fd3a5; --op: #ffa66b; --kw: #ff7ac0;
      --neg: #ff8a80; --err-bg: #4a1f22; --warn: #f0b45a; --chip: #262a36; --chip-on: #8aa8ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .bar { position: relative; }
  .field { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .backdrop, #q { font: 15px/24px var(--mono); padding: 10px 14px; margin: 0; white-space: pre; letter-spacing: 0; }
  .backdrop { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--text); }
  .backdrop .inner { display: inline-block; min-width: 100%; }
  #q { position: relative; width: 100%; border: 0; outline: 0; background: transparent; color: transparent; caret-color: var(--text); }
  #q::placeholder { color: var(--muted); }
  .t-field { color: var(--field); } .t-colon { color: var(--muted); } .t-operator { color: var(--op); font-weight: 600; }
  .t-value { color: var(--value); } .t-separator { color: var(--muted); } .t-keyword { color: var(--kw); font-weight: 600; }
  .t-negation { color: var(--neg); font-weight: 700; } .t-paren { color: var(--muted); font-weight: 700; }
  .t-error, .invalid { text-decoration: wavy underline var(--neg); text-underline-offset: 3px; background: var(--err-bg); border-radius: 3px; }
  .menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 100%; max-height: 280px; overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); padding: 4px; list-style: none; margin: 0; }
  .menu[hidden] { display: none; }
  .menu li { display: flex; gap: 12px; justify-content: space-between; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 14px; }
  .menu li small { color: var(--muted); font-family: system-ui, sans-serif; }
  .menu li[aria-selected="true"] { background: var(--chip); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .chip { border: 1px solid var(--border); background: var(--chip); color: var(--text); border-radius: 999px; padding: 3px 12px; font: 13px var(--mono); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--panel); }
  .diag { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .diag li { padding: 2px 0; }
  .diag .error { color: var(--neg); } .diag .warning { color: var(--warn); }
  .diag button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td:nth-child(2) { min-width: 200px; }
  .tag { display: inline-block; font: 12px var(--mono); background: var(--chip); border-radius: 4px; padding: 0 6px; margin: 1px 2px 1px 0; }
  .wrap { overflow-x: auto; }
  pre.ast { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font: 12px/1.45 var(--mono); max-height: 320px; overflow: auto; margin: 0; }
  code { font-family: var(--mono); font-size: 13px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>querybar playground</h1>
  <p class="lead">Type a GitHub-style query. Try <code>is:open label:bug,ui -author:bot*</code>, <code>stars:&gt;=10 OR created:7d</code> or a typo like <code>is:opne</code>.</p>

  <div class="bar">
    <div class="field">
      <div class="backdrop" aria-hidden="true"><span class="inner" id="hl"></span></div>
      <input id="q" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="menu"
             aria-label="Search issues" placeholder="Search…  (try: is:open label:bug)">
    </div>
    <ul class="menu" id="menu" role="listbox" hidden></ul>
  </div>

  <div class="chips" id="chips"></div>
  <ul class="diag" id="diag" aria-live="polite"></ul>

  <h2><span id="count"></span></h2>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Title</th><th>State</th><th>Author</th><th>Labels</th><th>★</th><th>Created</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2>Canonical form</h2>
  <p><code id="formatted" class="muted"></code></p>
  <h2>Syntax tree</h2>
  <pre class="ast" id="ast"></pre>
</main>

<script type="module">
import { createQuerybar } from '../dist/index.js';

const DAY = 86400000;
const now = Date.now();
const issues = [
  { id: 101, title: 'Login button does nothing on Safari', author: 'alice', label: ['bug', 'ui'], is: 'open', stars: 14, created: now - 2 * DAY },
  { id: 102, title: 'Add dark mode', author: 'bob', label: ['feature', 'ui'], is: 'closed', stars: 52, created: now - 90 * DAY },
  { id: 103, title: 'Crash when uploading a café photo', author: 'Zoë', label: ['bug', 'good first issue'], is: 'open', stars: 3, created: now - 6 * DAY },
  { id: 104, title: 'Bump lodash from 4.17.20 to 4.17.21', author: 'dependabot', label: ['dependencies'], is: 'open', stars: 0, created: now - 1 * DAY },
  { id: 105, title: '한글 검색 지원', author: 'minji', label: ['feature', 'i18n'], is: 'open', stars: 9, created: now - 20 * DAY },
  { id: 106, title: 'Docs: typo in README', author: 'carol', label: ['docs', 'good first issue'], is: 'draft', stars: 1, created: now - 40 * DAY },
  { id: 107, title: 'Memory leak in websocket reconnect', author: 'alice', label: ['bug', 'performance'], is: 'open', stars: 31, created: now - 12 * DAY },
  { id: 108, title: 'Support CSV export', author: 'dave', label: ['feature'], is: 'closed', stars: 18, created: now - 200 * DAY },
  { id: 109, title: 'Bump vite from 5.0.0 to 5.0.1', author: 'renovate-bot', label: ['dependencies'], is: 'closed', stars: 0, created: now - 30 * DAY },
  { id: 110, title: 'Keyboard navigation in date picker', author: 'erin', label: ['a11y', 'ui'], is: 'open', stars: 7, created: now - 3 * DAY },
];

const search = createQuerybar({
  fields: {
    is: { type: 'enum', values: ['open', 'closed', 'draft'], description: 'Issue state' },
    author: { type: 'string', aliases: ['by'], suggestions: [...new Set(issues.map((i) => i.author))], description: 'Who opened it' },
    label: { type: 'string', suggestions: [...new Set(issues.flatMap((i) => i.label))], description: 'Has label' },
    stars: { type: 'number', description: 'Star count, e.g. >=10 or 5..20' },
    created: { type: 'date', description: 'e.g. 2024-05, today, 7d' },
    sort: { type: 'enum', values: ['stars', 'created'], filter: false, description: 'Sort order (not a filter)' },
  },
  text: ['title', 'author'],
  timeZone: 'local',
});

const $ = (id) => document.getElementById(id);
const input = $('q');
const menu = $('menu');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

let suggestion = null;
let active = 0;

function renderHighlight() {
  $('hl').innerHTML = search.tokenize(input.value)
    .map((t) => `<span class="t-${t.type}${t.invalid ? ' invalid' : ''}">${esc(t.text)}</span>`)
    .join('') + ' ';
  document.querySelector('.backdrop').scrollLeft = input.scrollLeft;
}

function renderMenu() {
  const cursor = input.selectionStart ?? input.value.length;
  suggestion = document.activeElement === input ? search.suggest(input.value, cursor, { limit: 12 }) : null;
  const items = suggestion ? suggestion.items : [];
  if (!items.length) {
    menu.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    return;
  }
  active = Math.min(active, items.length - 1);
  menu.innerHTML = items.map((s, i) =>
    `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === active}"><span>${esc(s.label)}</span>${s.description ? `<small>${esc(s.description)}</small>` : ''}</li>`).join('');
  menu.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  input.setAttribute('aria-activedescendant', `opt-${active}`);
}

function accept(i) {
  if (!suggestion || !suggestion.items[i]) return;
  const { text, cursor } = search.applySuggestion(input.value, suggestion, suggestion.items[i]);
  setQuery(text, cursor);
}

function setQuery(text, cursor = text.length) {
  input.value = text;
  input.setSelectionRange(cursor, cursor);
  active = 0;
  update();
}

const chips = [
  ['is', 'open'], ['is', 'closed'], ['label', 'bug'], ['label', 'ui'], ['label', 'good first issue'],
  ['author', 'dependabot', true], ['created', '7d'],
];

function renderChips() {
  $('chips').innerHTML = chips.map(([f, v, neg], i) => {
    const on = search.hasFilter(input.value, f, v, { negated: !!neg });
    return `<button class="chip" data-i="${i}" aria-pressed="${on}">${neg ? '-' : ''}${esc(f)}:${esc(/\s/.test(v) ? `"${v}"` : v)}</button>`;
  }).join('');
}

function update() {
  const result = search.parse(input.value);
  renderHighlight();
  renderMenu();
  renderChips();

  $('diag').innerHTML = result.diagnostics.map((d, i) =>
    `<li class="${d.severity}">${d.severity === 'error' ? '✖' : '⚠'} ${esc(d.message)}${d.suggestion ? ` <button data-d="${i}">Use “${esc(d.suggestion)}”</button>` : ''}</li>`).join('');
  $('diag').onclick = (e) => {
    const d = result.diagnostics[e.target.dataset.d];
    if (!d) return;
    // Replace exactly the reported span with the suggestion.
    setQuery(input.value.slice(0, d.start) + d.suggestion + input.value.slice(d.end));
    input.focus();
  };

  let rows = search.filter(issues, result);
  const sort = search.getValues(input.value, 'sort')[0];
  if (sort && sort.kind === 'enum') rows = rows.slice().sort((a, b) => b[sort.value] - a[sort.value]);

  $('count').textContent = `${rows.length} of ${issues.length} issues`;
  $('rows').innerHTML = rows.map((r) => `<tr>
      <td class="muted">${r.id}</td><td>${esc(r.title)}</td><td>${r.is}</td><td>${esc(r.author)}</td>
      <td>${r.label.map((l) => `<span class="tag">${esc(l)}</span>`).join('')}</td><td>${r.stars}</td>
      <td class="muted">${new Date(r.created).toLocaleDateString()}</td></tr>`).join('') ||
    '<tr><td colspan="7" class="muted">No matches.</td></tr>';
  $('formatted').textContent = search.format(input.value) || '(empty)';
  $('ast').textContent = JSON.stringify(result.ast, (k, v) => (k === 'start' || k === 'end' || k === 'raw' ? undefined : v), 2) ?? 'null';
}

input.addEventListener('input', () => { active = 0; update(); });
input.addEventListener('click', update);
input.addEventListener('focus', update);
input.addEventListener('scroll', renderHighlight);
input.addEventListener('blur', () => setTimeout(() => { menu.hidden = true; input.setAttribute('aria-expanded', 'false'); }, 120));
input.addEventListener('keyup', (e) => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) update(); });
input.addEventListener('keydown', (e) => {
  const open = !menu.hidden && suggestion && suggestion.items.length;
  if (e.key === 'ArrowDown' && open) { active = (active + 1) % suggestion.items.length; renderMenu(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && open) { active = (active - 1 + suggestion.items.length) % suggestion.items.length; renderMenu(); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === 'Tab') && open) { accept(active); e.preventDefault(); }
  else if (e.key === 'Escape') { menu.hidden = true; input.setAttribute('aria-expanded', 'false'); }
});
menu.addEventListener('mousedown', (e) => {
  const li = e.target.closest('li');
  if (li) { e.preventDefault(); accept(Number(li.dataset.i)); }
});
$('chips').addEventListener('click', (e) => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  const [f, v, neg] = chips[i];
  setQuery(search.toggleFilter(input.value, f, v, { negated: !!neg }));
});

const initial = new URLSearchParams(location.search).get('q');
input.value = initial ?? 'is:open label:bug,ui -author:*bot';
update();
</script>
</body>
</html>
